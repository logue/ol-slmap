<!doctype html>
<html
  lang="en"
  class="wa-theme-default wa-palette-default wa-brand-blue wa-neutral-gray"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLayers SecondLife Map Viewer</title>
  </head>
  <body>
    <wa-page mobile-breakpoint="768" flex-direction="column">
      <header
        slot="header"
        class="wa-dark wa-cluster wa-split wa-align-items-center"
      >
        <h1 slot="header-start" class="wa-heading-l">
          OpenLayers SecondLife Map Viewer
        </h1>

        <div
          slot="header-end"
          class="wa-cluster wa-gap-s wa-align-items-center"
        >
          <wa-button
            appearance="plain"
            href="https://github.com/secondlife/ol-slmap"
            target="_blank"
            size="small"
          >
            <wa-icon name="github" family="brands"></wa-icon>
          </wa-button>
          <form class="wa-desktop-only navbar-search" id="search-form">
            <wa-input
              id="search-input"
              type="search"
              size="small"
              form="search-form"
              placeholder="Region..."
              clearable
            >
              <wa-button
                id="search"
                type="submit"
                slot="end"
                size="small"
                appearance="plain"
              >
                <wa-icon name="magnifying-glass"></wa-icon>
              </wa-button>
            </wa-input>
          </form>
          <wa-button class="wa-mobile-only" variant="neutral" size="small">
            <wa-icon name="magnifying-glass"></wa-icon>
          </wa-button>
        </div>
      </header>
      <main>
        <div id="map"></div>
      </main>
    </wa-page>
    <div id="popup" class="ol-popup">
      <wa-card>
        <div class="popup-header-wrapper">
          <h3 id="popup-title">Region</h3>
          <wa-icon-button
            name="x-lg"
            id="popup-closer"
            class="popup-close"
          ></wa-icon-button>
        </div>
        <div id="popup-content"></div>
      </wa-card>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
